name: release

# A pushed vX.Y.Z tag builds that commit with scripts/stage-package.sh in a
# read-only build job and publishes a GitHub Release with the package tarball
# and its .sha256 from a second publish job that holds the write token. The
# build job produces the tarball and its checksum as a workflow artifact, and
# the publish job only verifies that artifact and uploads it: it checks out no
# source and runs no build, test or install step.
# workflow_dispatch releases a tag that already exists, for a tag whose commit
# predates this workflow (a tag push runs the workflow file at the tagged
# commit). It only runs from main: the steps below execute scripts from the
# checkout with the release write token, so a manual run from any other
# branch would run that branch's scripts. See docs/releasing.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. v0.2.3
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # build only; the write token never enters this job
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    defaults:
      run:
        # Explicit bash adds pipefail, so a failed build cannot hide behind a pipe.
        shell: bash
    steps:
      # A manual run's checkout is the ref it was dispatched from, so refuse
      # any dispatch that is not from main before checking anything out or
      # running a script. Tag pushes are unaffected: they run at the tagged
      # commit, which the build step requires to be on main.
      - name: Require main for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Refusing manual release from $GITHUB_REF: run the release workflow from refs/heads/main."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Manual dispatch checks out main (guarded above), never the
          # dispatched-from branch, so the release scripts are main's. A tag
          # push checks out the tagged commit, whose history the build needs.
          # stage-package.sh needs origin/main and the tag's history.
          ref: ${{ github.event_name == 'workflow_dispatch' && 'refs/heads/main' || github.ref }}
          fetch-depth: 0
          # npm ci runs dependency scripts; keep the read token out of .git/config.
          persist-credentials: false
      # No npm cache: a release build should not restore state other runs saved.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check tag, package.json and PLUGIN_VERSION agree
        run: scripts/check-release-version.sh "$TAG"

      - name: Extract the CHANGELOG section
        run: scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"

      - name: Build the package
        run: |
          sha=$(git rev-parse "refs/tags/$TAG^{commit}")
          mkdir "$RUNNER_TEMP/packages" "$RUNNER_TEMP/assets"
          dir=$(scripts/stage-package.sh "$sha" "$RUNNER_TEMP/packages" | tail -n 1)
          test -d "$dir"
          name=$(basename "$dir")
          # Fixed order, owners and mtimes, so the same commit gives the same bytes.
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime="@$(git log -1 --format=%ct "$sha")" \
            -C "$RUNNER_TEMP/packages" -cf - "$name" | gzip -n > "$RUNNER_TEMP/assets/$name.tgz"
          cd "$RUNNER_TEMP/assets"
          sha256sum "$name.tgz" > "$name.tgz.sha256"
          sha256sum -c "$name.tgz.sha256"

      # A tarball with a link in it once shipped an absolute plugin-sdk symlink
      # to the build host's SDK path and could not load anywhere else. The
      # package is plain files and directories; fail the release otherwise.
      - name: Check the tarball holds no links
        run: scripts/check-tarball-links.sh "$RUNNER_TEMP"/assets/*.tgz

      # The notes travel with the assets so the publish job needs no source
      # checkout to create the release.
      - name: Stage release notes with the assets
        run: cp "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/assets/notes.md"

      - name: Upload the release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/assets
          if-no-files-found: error
          retention-days: 1
          overwrite: false
          # The tarball is already gzipped; stored bytes are the release bytes.
          compression-level: 0

  publish:
    name: publish
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # create the release; GITHUB_TOKEN only, no tagged code in this job
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    defaults:
      run:
        # Explicit bash adds pipefail, so a failed check cannot hide behind a pipe.
        shell: bash
    steps:
      # No checkout, no setup-node, no install or build step: this job holds the
      # write token and only verifies the artifact the build job produced.
      - name: Download the release assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-assets
          path: ${{ runner.temp }}/assets

      - name: Verify the release assets
        run: |
          cd "$RUNNER_TEMP/assets"
          test -f notes.md
          shopt -s nullglob
          tarballs=( *.tgz )
          checksums=( *.tgz.sha256 )
          test "${#tarballs[@]}" -eq 1
          test "${#checksums[@]}" -eq 1
          tarball="${tarballs[0]}"
          # The checksum filename must be the tarball's own .sha256, so a
          # checksum for some other file cannot stand in for this tarball.
          test "${checksums[0]}" = "$tarball.sha256"
          # Exactly one entry, naming exactly this tarball by basename:
          # sha256sum -c alone would trust whatever filename the checksum
          # file lists and could pass for notes.md while the tarball that
          # is published went unchecked. The entry filename is everything
          # after the 64-char digest and its two-char separator, taken
          # whole: taking only the second whitespace field would let an
          # entry naming "pkg.tgz decoy" pass for pkg.tgz while sha256sum
          # -c checked the decoy file instead.
          test "$(wc -l < "${checksums[0]}")" -eq 1
          test "$(cut -c67- "${checksums[0]}")" = "$tarball"
          sha256sum -c "${checksums[0]}"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Fails when a release for the tag already exists: assets are never replaced.
        run: |
          prerelease=()
          [[ $TAG == *-* ]] && prerelease=(--prerelease)
          gh release create "$TAG" "$RUNNER_TEMP"/assets/*.tgz "$RUNNER_TEMP"/assets/*.tgz.sha256 "${prerelease[@]}" \
            --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/assets/notes.md"
