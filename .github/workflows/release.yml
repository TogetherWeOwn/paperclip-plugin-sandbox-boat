name: release

# A pushed vX.Y.Z tag builds that commit with scripts/stage-package.sh and
# publishes a GitHub Release with the package tarball and its .sha256.
# workflow_dispatch releases a tag that already exists, for a tag whose commit
# predates this workflow (a tag push runs the workflow file at the tagged
# commit). It only runs from main: the steps below execute scripts from the
# checkout with the release write token, so a manual run from any other
# branch would run that branch's scripts. See docs/releasing.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. v0.2.3
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # create the release; GITHUB_TOKEN only
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    defaults:
      run:
        # Explicit bash adds pipefail, so a failed build cannot hide behind a pipe.
        shell: bash
    steps:
      # A manual run's checkout is the ref it was dispatched from, so refuse
      # any dispatch that is not from main before checking anything out or
      # running a script. Tag pushes are unaffected: they run at the tagged
      # commit, which the build step requires to be on main.
      - name: Require main for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Refusing manual release from $GITHUB_REF: run the release workflow from refs/heads/main."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Manual dispatch checks out main (guarded above), never the
          # dispatched-from branch, so the release scripts are main's. A tag
          # push checks out the tagged commit, whose history the build needs.
          # stage-package.sh needs origin/main and the tag's history.
          ref: ${{ github.event_name == 'workflow_dispatch' && 'refs/heads/main' || github.ref }}
          fetch-depth: 0
          # npm ci runs dependency scripts; keep the write token out of .git/config.
          persist-credentials: false
      # No npm cache: a release build should not restore state other runs saved.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check tag, package.json and PLUGIN_VERSION agree
        run: scripts/check-release-version.sh "$TAG"

      - name: Extract the CHANGELOG section
        run: scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"

      - name: Build the package
        run: |
          sha=$(git rev-parse "refs/tags/$TAG^{commit}")
          mkdir "$RUNNER_TEMP/packages" "$RUNNER_TEMP/assets"
          dir=$(scripts/stage-package.sh "$sha" "$RUNNER_TEMP/packages" | tail -n 1)
          test -d "$dir"
          name=$(basename "$dir")
          # Fixed order, owners and mtimes, so the same commit gives the same bytes.
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime="@$(git log -1 --format=%ct "$sha")" \
            -C "$RUNNER_TEMP/packages" -cf - "$name" | gzip -n > "$RUNNER_TEMP/assets/$name.tgz"
          cd "$RUNNER_TEMP/assets"
          sha256sum "$name.tgz" > "$name.tgz.sha256"
          sha256sum -c "$name.tgz.sha256"

      # A tarball with a link in it once shipped an absolute plugin-sdk symlink
      # to the build host's SDK path and could not load anywhere else. The
      # package is plain files and directories; fail the release otherwise.
      - name: Check the tarball holds no links
        run: scripts/check-tarball-links.sh "$RUNNER_TEMP"/assets/*.tgz

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Fails when a release for the tag already exists: assets are never replaced.
        run: |
          prerelease=()
          [[ $TAG == *-* ]] && prerelease=(--prerelease)
          gh release create "$TAG" "$RUNNER_TEMP"/assets/* "${prerelease[@]}" \
            --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
