name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

# A newer push to the same PR supersedes the old run; main keeps every run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Required status check on main. Renaming this changes the check context
    # and blocks every merge until the ruleset is updated to match.
    name: check
    # Pinned: ubuntu-latest moved to 26.04, where native-sync timing tests fail.
    # Move up deliberately once the suite passes on the new image.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: shellcheck scripts/*.sh
