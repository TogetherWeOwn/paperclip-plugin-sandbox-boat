name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

# A newer push to the same PR supersedes the old run; main keeps every run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Required status check on main. Renaming this changes the check context
    # and blocks every merge until the ruleset is updated to match. Only the
    # 26.04 leg is named `check`; the 24.04 leg keeps the previous image green
    # (Python 3.12 there, 3.14 on 26.04: the sync helper runs on both).
    name: ${{ matrix.os == 'ubuntu-26.04' && 'check' || format('check ({0})', matrix.os) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Toolchain versions
        run: |
          grep PRETTY_NAME /etc/os-release
          uname -r
          python3 --version
          tar --version | head -n 1
          ls -l "$(command -v cat)"
          cat --version | head -n 1
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: shellcheck scripts/*.sh
